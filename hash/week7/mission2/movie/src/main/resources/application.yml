spring:
  application:
    name: umc-movie

  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  sql:
    init:
      mode: never

  mvc:
    problemdetails:
      enabled: false

  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}