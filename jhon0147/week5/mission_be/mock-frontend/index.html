<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORS 확인</title></head>
<body>
  <h1>간이 프론트: 닉네임 중복 확인</h1>
  <label>백엔드 주소 <input id="base" value="http://localhost:8080"></label>
  <button id="check" type="button">수현으로 중복 확인</button>
  <pre id="result" aria-live="polite"></pre>
  <script>
    document.getElementById("check").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.textContent = "요청 중...";
      try {
        const base = document.getElementById("base").value.replace(/\/$/, "");
        const response = await fetch(base + "/members/nickname/" + encodeURIComponent("수현"));
        result.textContent = "HTTP " + response.status + "\n" + JSON.stringify(await response.json(), null, 2);
      } catch (error) {
        console.error(error);
        result.textContent = "응답을 읽을 수 없습니다. 개발자 도구 Console/Network를 확인하세요.";
      }
    });
  </script>
</body>
</html>
