spring:
  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # 별점 3.5가 3으로 잘려 저장되지 않고 400으로 거절되도록 합니다.
      accept-float-as-int: false

# JwtUtil이 ${jwt.secret}으로 읽으므로 spring: 아래가 아닌 최상위에 둡니다.
jwt:
  secret: ${JWT_SECRET} # 서명에 쓸 비밀키. 코드에 직접 쓰지 않습니다 (HS256 기준 32바이트 이상)
  access-expiration: ${JWT_ACCESS_EXPIRATION} # 토큰 유효시간(초)
