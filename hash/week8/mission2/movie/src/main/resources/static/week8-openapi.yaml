openapi: 3.0.3
info:
  title: UMCine 8주차 API
  version: 1.0.0
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: 로그인 (공개)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: hash8a@example.com
              password: <password>
      responses:
        '200':
          description: 로그인에 성공했습니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/LoginResult'
              example:
                isSuccess: true
                code: COMMON200
                message: 로그인에 성공했습니다.
                result:
                  nickname: 해시8A
                  accessToken: <accessToken>
        '401':
          description: 로그인 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                AUTH401_1:
                  value:
                    isSuccess: false
                    code: AUTH401_1
                    message: 이메일 또는 비밀번호가 올바르지 않습니다.
                    result: null
  /favorites:
    get:
      summary: 내 즐겨찾기 목록 조회
      responses:
        '200':
          description: 즐겨찾기 목록을 조회했습니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      result:
                        type: array
                        items:
                          $ref: '#/components/schemas/Favorite'
              example:
                isSuccess: true
                code: COMMON200
                message: 즐겨찾기 목록을 조회했습니다.
                result:
                  - favoriteId: 1
                    movieId: 550
                    createdAt: '2026-11-18T20:00:00'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                AUTH401_2:
                  value:
                    isSuccess: false
                    code: AUTH401_2
                    message: 로그인이 필요한 요청입니다.
                    result: null
                AUTH401_3:
                  value:
                    isSuccess: false
                    code: AUTH401_3
                    message: 유효하지 않은 토큰입니다.
                    result: null
                AUTH401_4:
                  value:
                    isSuccess: false
                    code: AUTH401_4
                    message: 토큰이 만료되었습니다.
                    result: null
    post:
      summary: 즐겨찾기 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
            example:
              movieId: 550
      responses:
        '201':
          description: 즐겨찾기를 등록했습니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Favorite'
              example:
                isSuccess: true
                code: COMMON201
                message: 즐겨찾기를 등록했습니다.
                result:
                  favoriteId: 1
                  movieId: 550
                  createdAt: '2026-11-18T20:00:00'
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                COMMON4001:
                  value:
                    isSuccess: false
                    code: COMMON4001
                    message: 영화 ID는 양수여야 합니다.
                    result: null
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                AUTH401_2:
                  value:
                    isSuccess: false
                    code: AUTH401_2
                    message: 로그인이 필요한 요청입니다.
                    result: null
                AUTH401_3:
                  value:
                    isSuccess: false
                    code: AUTH401_3
                    message: 유효하지 않은 토큰입니다.
                    result: null
                AUTH401_4:
                  value:
                    isSuccess: false
                    code: AUTH401_4
                    message: 토큰이 만료되었습니다.
                    result: null
        '404':
          description: 회원 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                MEMBER404_1:
                  value:
                    isSuccess: false
                    code: MEMBER404_1
                    message: 해당 회원을 찾을 수 없습니다.
                    result: null
        '409':
          description: 즐겨찾기 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                FAVORITE409_1:
                  value:
                    isSuccess: false
                    code: FAVORITE409_1
                    message: 이미 이 영화를 즐겨찾기했습니다.
                    result: null
  /favorites/{movieId}:
    parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 550
    get:
      summary: 특정 영화 즐겨찾기 여부 조회
      responses:
        '200':
          description: 즐겨찾기 여부를 조회했습니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/FavoriteStatus'
              example:
                isSuccess: true
                code: COMMON200
                message: 즐겨찾기 여부를 조회했습니다.
                result:
                  isFavorite: false
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                COMMON4001:
                  value:
                    isSuccess: false
                    code: COMMON4001
                    message: 영화 ID는 양수여야 합니다.
                    result: null
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                AUTH401_2:
                  value:
                    isSuccess: false
                    code: AUTH401_2
                    message: 로그인이 필요한 요청입니다.
                    result: null
                AUTH401_3:
                  value:
                    isSuccess: false
                    code: AUTH401_3
                    message: 유효하지 않은 토큰입니다.
                    result: null
                AUTH401_4:
                  value:
                    isSuccess: false
                    code: AUTH401_4
                    message: 토큰이 만료되었습니다.
                    result: null
    delete:
      summary: 즐겨찾기 해제
      responses:
        '200':
          description: 즐겨찾기를 해제했습니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      result:
                        type: object
                        nullable: true
                        enum:
                          - null
              example:
                isSuccess: true
                code: COMMON200
                message: 즐겨찾기를 해제했습니다.
                result: null
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                COMMON4001:
                  value:
                    isSuccess: false
                    code: COMMON4001
                    message: 영화 ID는 양수여야 합니다.
                    result: null
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                AUTH401_2:
                  value:
                    isSuccess: false
                    code: AUTH401_2
                    message: 로그인이 필요한 요청입니다.
                    result: null
                AUTH401_3:
                  value:
                    isSuccess: false
                    code: AUTH401_3
                    message: 유효하지 않은 토큰입니다.
                    result: null
                AUTH401_4:
                  value:
                    isSuccess: false
                    code: AUTH401_4
                    message: 토큰이 만료되었습니다.
                    result: null
        '404':
          description: 즐겨찾기 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                FAVORITE404_1:
                  value:
                    isSuccess: false
                    code: FAVORITE404_1
                    message: 해당 즐겨찾기를 찾을 수 없습니다.
                    result: null
  /movie-records:
    post:
      summary: 영화 기록 저장
      description: addToFavorites가 false라면 favorite는 null입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieRecordRequest'
            example:
              movieId: 238
              score: 5
              comment: 다시 보고 싶은 영화
              addToFavorites: true
      responses:
        '201':
          description: 영화 기록을 저장했습니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/MovieRecord'
              example:
                isSuccess: true
                code: COMMON201
                message: 영화 기록을 저장했습니다.
                result:
                  rating:
                    ratingId: 7
                    movieId: 238
                    score: 5
                    comment: 다시 보고 싶은 영화
                    createdAt: '2026-11-18T20:00:00'
                    updatedAt: '2026-11-18T20:00:00'
                  favorite:
                    favoriteId: 1
                    movieId: 238
                    createdAt: '2026-11-18T20:00:00'
        '400':
          description: 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                COMMON4001:
                  value:
                    isSuccess: false
                    code: COMMON4001
                    message: 영화 ID는 양수여야 합니다.
                    result: null
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                AUTH401_2:
                  value:
                    isSuccess: false
                    code: AUTH401_2
                    message: 로그인이 필요한 요청입니다.
                    result: null
                AUTH401_3:
                  value:
                    isSuccess: false
                    code: AUTH401_3
                    message: 유효하지 않은 토큰입니다.
                    result: null
                AUTH401_4:
                  value:
                    isSuccess: false
                    code: AUTH401_4
                    message: 토큰이 만료되었습니다.
                    result: null
        '404':
          description: 회원 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                MEMBER404_1:
                  value:
                    isSuccess: false
                    code: MEMBER404_1
                    message: 해당 회원을 찾을 수 없습니다.
                    result: null
        '409':
          description: 평점 또는 즐겨찾기 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                RATING409_1:
                  value:
                    isSuccess: false
                    code: RATING409_1
                    message: 이미 이 영화에 평점을 남겼습니다.
                    result: null
                FAVORITE409_1:
                  value:
                    isSuccess: false
                    code: FAVORITE409_1
                    message: 이미 이 영화를 즐겨찾기했습니다.
                    result: null
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Response:
      type: object
      required:
        - isSuccess
        - code
        - message
        - result
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
    Favorite:
      type: object
      required:
        - favoriteId
        - movieId
        - createdAt
      properties:
        favoriteId:
          type: integer
          format: int64
        movieId:
          type: integer
          format: int64
          minimum: 1
          example: 550
        createdAt:
          type: string
          description: 서버 로컬 ISO 8601 날짜/시간
          example: '2026-11-18T20:00:00'
    FavoriteStatus:
      type: object
      required:
        - isFavorite
      properties:
        isFavorite:
          type: boolean
    FavoriteRequest:
      type: object
      required:
        - movieId
      properties:
        movieId:
          type: integer
          format: int64
          minimum: 1
          example: 550
      additionalProperties: false
    MovieRecordRequest:
      type: object
      required:
        - movieId
        - score
        - addToFavorites
      properties:
        movieId:
          type: integer
          format: int64
          minimum: 1
          example: 550
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          nullable: true
        addToFavorites:
          type: boolean
      additionalProperties: false
    Rating:
      type: object
      required:
        - ratingId
        - movieId
        - score
        - comment
        - createdAt
        - updatedAt
      properties:
        ratingId:
          type: integer
          format: int64
        movieId:
          type: integer
          format: int64
          minimum: 1
          example: 550
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          nullable: true
        createdAt:
          type: string
          description: 서버 로컬 ISO 8601 날짜/시간
          example: '2026-11-18T20:00:00'
        updatedAt:
          type: string
          description: 서버 로컬 ISO 8601 날짜/시간
          example: '2026-11-18T20:00:00'
    MovieRecord:
      type: object
      required:
        - rating
        - favorite
      properties:
        rating:
          $ref: '#/components/schemas/Rating'
        favorite:
          oneOf:
            - $ref: '#/components/schemas/Favorite'
            - type: object
              nullable: true
              enum:
                - null
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResult:
      type: object
      required:
        - nickname
        - accessToken
      properties:
        nickname:
          type: string
        accessToken:
          type: string