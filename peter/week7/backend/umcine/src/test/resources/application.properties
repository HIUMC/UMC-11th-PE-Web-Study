spring.datasource.url=jdbc:h2:mem:umcine-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# Public test-only key; independent of local .env settings.
jwt.secret=umcine-test-only-key-not-for-production-0123456789
jwt.access-expiration=3600
