spring:
  application:
    name: umc-movie

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # 이미 만든 테이블과 엔티티 구조가 맞는지만 확인
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET} # 서명에 쓸 비밀키. 코드에 직접 안 쓰고 환경변수로 받음
  access-expiration: ${JWT_ACCESS_EXPIRATION} # 토큰 유효시간(초)
