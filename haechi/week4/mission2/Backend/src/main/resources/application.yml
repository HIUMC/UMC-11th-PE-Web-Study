spring:
  config:
    # 프로젝트 루트의 .env 파일을 읽어 환경변수로 사용 (파일이 없어도 에러 X)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:umc_book}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 2주차에 만든 테이블을 그대로 사용 → 엔티티와 테이블 구조가 맞는지 '검사만' 함 (테이블 변경 X)
      ddl-auto: validate
    # 트랜잭션(Service)이 끝나면 DB 커넥션을 반납 → Controller에서 지연 로딩이 일어나지 않게 함
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    # 실행되는 SQL을 콘솔에서 확인 (ORM도 내부에서는 SQL을 실행한다는 것을 눈으로 확인)
    show-sql: true

server:
  error:
    include-message: always
