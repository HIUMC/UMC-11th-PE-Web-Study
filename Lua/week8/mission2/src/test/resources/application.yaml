spring:
  datasource:
    url: jdbc:h2:mem:movie;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long
  access-expiration: 3600
