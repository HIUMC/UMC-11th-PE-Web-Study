spring:
  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # 별점 3.5가 3으로 잘려 저장되지 않고 400으로 거절되도록 합니다.
      accept-float-as-int: false