spring:
  application:
    name: umc-movie

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # 이미 만든 테이블과 엔티티 구조가 맞는지만 확인
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
