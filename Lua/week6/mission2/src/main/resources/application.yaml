spring:
  datasource:
    # 개발 환경에서 최초 실행 시 데이터베이스가 없으면 MySQL이 생성합니다.
    url: jdbc:mysql://localhost:3306/umcine?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 엔티티 변경 사항을 테이블에 반영합니다. 운영 환경에서는 validate로 변경하세요.
      ddl-auto: update
    open-in-view: false
